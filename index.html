<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Contact Form</title> 
    <!-- Style the form for a clean, modern look --> 
    <style> 
        body { 
            font-family: Arial, sans-serif; 
            background-color: #62d106; 
            padding: 20px; 
        } 
        .form-container { 
            max-width: 500px; 
            margin: 0 auto; 
            background: #ba3aaf; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        } 
        h2 { 
            margin-bottom: 20px; 
            color: #ffffff; /* Changed header text to white */
            text-align: center;
        } 
        .form-group { 
            margin-bottom: 15px; 
        } 
        label { 
            display: block; 
            margin-bottom: 5px; 
            font-weight: bold; 
            color: #555555; 
        } 
        input[type="text"], 
        input[type="email"], 
        input[type="tel"], 
        input[type="date"], 
        textarea { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            box-sizing: border-box; 
        } 
        textarea { 
            resize: vertical; 
            height: 120px; 
        } 
        button { 
            width: 100%; 
            padding: 12px; 
            background-color: #007bff; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            font-size: 16px; 
            cursor: pointer; 
        } 
        button:hover { 
            background-color: #0056b3; 
        } 
    </style> 
    <!-- Include the official, working EmailJS SDK --> 
    <script type="text/javascript" src="https://jsdelivr.net"></script> 
    <script type="text/javascript"> 
        (function() { 
            // BACKEND SETUP: Pre-configured with your Public Key
            emailjs.init("lQg3_7NSDPUU_nzAb"); 
        })(); 
    </script> 
</head> 
<body> 
<div class="form-container"> 
    <h2>Book an Date with Charles -- Handsome Strong Man in a band that thinks you're cute</h2> 
    <form id="contact-form"> 
        <div class="form-group"> 
            <label for="user_name">Full Name</label> 
            <input type="text" id="user_name" name="user_name" required> 
        </div> 
        <div class="form-group"> 
            <label for="user_email">Email Address</label> 
            <input type="email" id="user_email" name="user_email" required> 
        </div> 
        <div class="form-group"> 
            <label for="user_phone">Phone Number</label> 
            <input type="tel" id="user_phone" name="user_phone" required> 
        </div> 
        <div class="form-group"> 
            <label for="preferred_date">Preferred Date</label> 
            <input type="date" id="preferred_date" name="preferred_date" required> 
        </div> 
        <div class="form-group"> 
            <label for="message">Additional Details</label> 
            <textarea id="message" name="message" placeholder="Type here if you want to send me mean words"></textarea> 
        </div> 
        <button type="submit">Send Details</button> 
    </form> 
</div> 
<script> 
    // Handle form submission 
    document.getElementById('contact-form').addEventListener('submit', function(event) { 
        event.preventDefault(); 
        
        // BACKEND SETUP: Replace with your actual Service ID and Template ID 
        const serviceID = 'service_ng2sr2s'; 
        const templateID = 'wnj8hol'; 
        
        emailjs.sendForm(serviceID, templateID, this) 
            .then(() => { 
                alert('Your information has been sent successfully!'); 
                document.getElementById('contact-form').reset(); 
            }, (error) => { 
                alert('Failed to send details. Error: ' + JSON.stringify(error)); 
            }); 
    }); 
</script> 
</body> 
</html>
